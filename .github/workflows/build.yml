name: Build

on:
  push:
    branches:
      - develop

#   pull_request:
#     types:
#       - closed
#     branches:
#       - develop

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install cmake pkg-config nasm

      - name: Build SDL 2.32.10 for macOS universal
        run: |
          bash tools/build_sdl_macos.sh

      - name: Build macOS (x86_64 + arm64)
        run: |
          cd MacOS
          make clean
          make

      - name: Verify dylib linking
        run: |
          cd MacOS
          make check-dylibs

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kiwi8-macOS
          path: MacOS/release/Kiwi8.app
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        run: |
          choco install cmake -y

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v1.1

      - name: Install nmake
        run: |
          choco install visualstudio2022buildtools -y --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools"

      - name: Build SDL 2.32.10 for Windows x64
        shell: pwsh
        run: |
          cd ${{ github.workspace }}
          .\tools\build_sdl_windows.ps1

      - name: Build Windows (x64)
        shell: pwsh
        run: |
          # Find Visual Studio installation
          $vsPath = & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -products * -requires Microsoft.VisualStudio.Workload.VCTools -property installationPath
          if ($vsPath) {
            Write-Host "Found Visual Studio at: $vsPath"
            $vcvarsPath = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
            & cmd /c """$vcvarsPath"" x64 && cd Windows && nmake clean && nmake build_release"
          } else {
            Write-Error "Visual Studio not found"
            exit 1
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kiwi8-Windows-x64
          path: |
            Windows/release/Kiwi8.exe
            Windows/release/SDL2.dll
          retention-days: 7
