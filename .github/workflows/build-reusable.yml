name: Build (Reusable)

on:
  workflow_call:

jobs:

  build-macos:
    strategy:
      matrix:
        runner:
          - { image: macos-15, arch: arm64 }
          - { image: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize branch name for artifact naming
        id: sanitize
        run: echo "ref_name=$(echo '${{ github.ref_name }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - name: Cache SDL
        uses: actions/cache@v4
        with:
          path: external/sdl/build
          key: sdl-2.32.10-macos-${{ matrix.runner.image }}-${{ matrix.runner.arch }}

      - name: Install build dependencies
        run: |
          brew install cmake pkg-config nasm

      - name: Build macOS (${{ matrix.runner.arch }})
        env:
          VERSION: ${{ steps.sanitize.outputs.ref_name }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          cd macos
          make clean
          make

      - name: Strip ad-hoc signatures (ARM64 strict Gatekeeper workaround)
        if: matrix.runner.arch == 'arm64'
        run: |
          codesign --remove-signature macos/release/Kiwi8.app/Contents/MacOS/Kiwi8 || true
          codesign --remove-signature macos/release/Kiwi8.app/Contents/Frameworks/libSDL2-2.0.0.dylib || true
          codesign --remove-signature macos/release/Kiwi8.app || true

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi8-${{ steps.sanitize.outputs.ref_name }}-macOS-${{ matrix.runner.arch == 'x64' && 'x86_64' || 'ARM64' }}
          path: macos/release/
          retention-days: 7

  build-windows:
    strategy:
      matrix:
        runner:
          - { image: windows-2022, arch: x64, vcarch: amd64 }
          - { image: windows-11-arm, arch: arm64, vcarch: amd64_arm64 }
    runs-on: ${{ matrix.runner.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize branch name for artifact naming
        id: sanitize
        shell: pwsh
        run: echo "ref_name=$('${{ github.ref_name }}'.Replace('/', '-'))" >> $env:GITHUB_OUTPUT

      - name: Cache SDL
        uses: actions/cache@v4
        with:
          path: external/sdl/build
          key: sdl-2.32.10-${{ matrix.runner.image }}-${{ matrix.runner.arch }}

      - name: Setup MSVC for ${{ matrix.runner.arch }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.runner.vcarch }}

      - name: Build Windows (${{ matrix.runner.arch }})
        env:
          VERSION: ${{ steps.sanitize.outputs.ref_name }}
          COMMIT_HASH: ${{ github.sha }}
        shell: cmd
        run: |
          cd Windows
          nmake clean
          nmake

      - name: Verify binary architecture
        shell: powershell
        run: |
          dumpbin /headers Windows\release\Kiwi8.exe | Select-String "machine"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi8-${{ steps.sanitize.outputs.ref_name }}-Windows-${{ matrix.runner.arch == 'x64' && 'x86_64' || 'ARM64' }}
          path: Windows\release\
          retention-days: 7

  build-linux:
    strategy:
      matrix:
        runner:
          - { image: ubuntu-22.04, arch: x64 }
          - { image: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize branch name for artifact naming
        id: sanitize
        run: echo "ref_name=$(echo '${{ github.ref_name }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config python3 libgtk-3-dev

      - name: Cache SDL
        uses: actions/cache@v4
        with:
          path: external/sdl/build
          key: sdl-2.32.10-linux-${{ matrix.runner.image }}-${{ matrix.runner.arch }}

      - name: Build Linux (${{ matrix.runner.arch }})
        env:
          VERSION: ${{ steps.sanitize.outputs.ref_name }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          cd linux
          make clean
          make

      - name: Verify binary dependencies
        run: |
          ldd ./linux/release/Kiwi8
          file ./linux/release/Kiwi8

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi8-${{ steps.sanitize.outputs.ref_name }}-Linux-${{ matrix.runner.arch == 'x64' && 'x86_64' || 'ARM64' }}
          path: linux/release/
          retention-days: 7
