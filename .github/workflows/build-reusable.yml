name: Build (Reusable)

on:
  workflow_call:

jobs:

  build-macos:
    runs-on: macos-14  # Apple Silicon (M1/M2) - supports universal binary builds
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize branch name for artifact naming
        id: sanitize
        run: echo "ref_name=$(echo '${{ github.ref_name }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - name: Cache SDL
        uses: actions/cache@v4
        with:
          path: external/sdl/build
          key: sdl-2.32.10-macos-14-${{ runner.arch }}

      - name: Install build dependencies
        run: |
          brew install cmake pkg-config nasm create-dmg

      - name: Build macOS (x86_64 + arm64)
        env:
          VERSION: ${{ steps.sanitize.outputs.ref_name }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          cd MacOS
          make clean
          make

      - name: Create macOS DMG
        run: |
          create-dmg \
            --volname "Kiwi8" \
            --volicon "macos/resources/Kiwi8.icns" \
            --background "macos/resources/dmg_background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 96 \
            --icon "Kiwi8.app" 100 200 \
            --hide-extension "Kiwi8.app" \
            --app-drop-link 530 200 \
            "Kiwi8-${{ steps.sanitize.outputs.ref_name }}-macOS.dmg" \
            "macos/release/Kiwi8.app"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi8-${{ steps.sanitize.outputs.ref_name }}-macOS
          path: Kiwi8-${{ steps.sanitize.outputs.ref_name }}-macOS.dmg
          retention-days: 7

  build-windows:
    runs-on: windows-2022  # Windows Server 2022 (x64)
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize branch name for artifact naming
        id: sanitize
        shell: pwsh
        run: echo "ref_name=$('${{ github.ref_name }}'.Replace('/', '-'))" >> $env:GITHUB_OUTPUT

      - name: Cache SDL
        uses: actions/cache@v4
        with:
          path: external/sdl/build
          key: sdl-2.32.10-windows-2022-${{ runner.arch }}

      - name: Configures build environment for x86-64
        uses: ilammy/msvc-dev-cmd@v1
        with:
            arch: amd64

      - name: Build Windows (x64)
        env:
          VERSION: ${{ steps.sanitize.outputs.ref_name }}
          COMMIT_HASH: ${{ github.sha }}
        shell: cmd
        run: |
          cd Windows
          nmake clean
          nmake

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi8-${{ steps.sanitize.outputs.ref_name }}-Windows
          path: Windows\release\
          retention-days: 7
