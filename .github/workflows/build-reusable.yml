name: Build (Reusable)

on:
  workflow_call:

jobs:

  macos:
    strategy:
      matrix:
        runner:
          - { image: macos-15, arch: arm64 }
          - { image: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize branch name for artifact naming
        id: sanitize
        run: |
          echo "ref_name=$(echo '${{ github.ref_name }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Cache SDL
        uses: actions/cache@v4
        with:
          path: external/sdl/build
          key: sdl-2.32.10-macos-${{ matrix.runner.arch }}

      - name: Install build dependencies
        run: |
          brew install cmake pkg-config nasm

      - name: Build for macOS (${{ matrix.runner.arch }})
        env:
          VERSION: ${{ steps.sanitize.outputs.ref_name }}
          SUB_VERSION: ${{ steps.sanitize.outputs.short_sha }}
        run: |
          cd macos
          make clean
          make release/Kiwi8.app/Contents/Resources/profiles.ini
          make release/Kiwi8.app

      - name: Verify binary and dependencies
        run: |
          file macos/release/Kiwi8.app/Contents/MacOS/Kiwi8
          otool -L macos/release/Kiwi8.app/Contents/MacOS/Kiwi8
          file macos/release/Kiwi8.app/Contents/Frameworks/libSDL2-2.0.0.dylib
          otool -L macos/release/Kiwi8.app/Contents/Frameworks/libSDL2-2.0.0.dylib

      - name: Add ad-hoc signing (ARM64 strict Gatekeeper workaround)
        if: matrix.runner.arch == 'arm64'
        run: |
          codesign --force --deep -s - macos/release/Kiwi8.app/Contents/MacOS/Kiwi8
          codesign --force --deep -s - macos/release/Kiwi8.app/Contents/Frameworks/libSDL2-2.0.0.dylib
          codesign --force --deep -s - macos/release/Kiwi8.app

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi8-${{ steps.sanitize.outputs.ref_name }}-macOS-${{ matrix.runner.arch }}
          path: macos/release/
          retention-days: 7

  windows:
    strategy:
      matrix:
        runner:
          - { image: windows-2022, arch: x64 }
          - { image: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize branch name for artifact naming
        id: sanitize
        shell: pwsh
        run: |
          echo "ref_name=$('${{ github.ref_name }}'.Replace('/', '-'))" >> $env:GITHUB_OUTPUT
          echo "short_sha=$('${{ github.sha }}'.Substring(0,7))" >> $env:GITHUB_OUTPUT

      - name: Cache SDL
        uses: actions/cache@v4
        with:
          path: external/sdl/build
          key: sdl-2.32.10-windows-${{ matrix.runner.arch }}

      - name: Setup MSVC for ${{ matrix.runner.arch }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.runner.arch }}

      - name: Build for Windows (${{ matrix.runner.arch }})
        env:
          VERSION: ${{ steps.sanitize.outputs.ref_name }}
          SUB_VERSION: ${{ steps.sanitize.outputs.short_sha }}
        shell: cmd
        run: |
          cd windows
          nmake clean
          nmake release\profiles.ini
          nmake release\Kiwi8.exe

      - name: Verify binary and dependencies
        shell: powershell
        run: |
          dumpbin /headers windows\release\Kiwi8.exe | Select-String "machine"
          dumpbin /dependents windows\release\Kiwi8.exe
          file windows\release\SDL2.dll
          dumpbin /headers windows\release\SDL2.dll | Select-String "machine"
          dumpbin /dependents windows\release\SDL2.dll

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi8-${{ steps.sanitize.outputs.ref_name }}-Windows-${{ matrix.runner.arch }}
          path: windows\release\
          retention-days: 7

  linux:
    strategy:
      matrix:
        runner:
          - { image: ubuntu-22.04, arch: x64 }
          - { image: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize branch name
        id: sanitize
        run: |
          echo "ref_name=$(echo '${{ github.ref_name }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config python3 libgtk-3-dev \
            xorg-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libjack-dev libpipewire-0.3-dev libdbus-1-dev

      - name: Cache SDL
        uses: actions/cache@v4
        with:
          path: external/sdl/build
          key: sdl-2.32.10-debian-${{ matrix.runner.arch }}

      - name: Build for Linux (${{ matrix.runner.arch }})
        env:
          VERSION: ${{ steps.sanitize.outputs.ref_name }}
          SUB_VERSION: ${{ steps.sanitize.outputs.short_sha }}
        run: |
          cd linux
          make clean
          make release/profiles.ini
          make release/Kiwi8

      - name: Verify binary and dependencies
        run: |
          ldd ./linux/release/Kiwi8
          file ./linux/release/Kiwi8
          ldd ./linux/release/libSDL2-2.0.so.0
          file ./linux/release/libSDL2-2.0.so.0

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi8-${{ steps.sanitize.outputs.ref_name }}-Debian-${{ matrix.runner.arch }}
          path: linux/release/
          retention-days: 7
